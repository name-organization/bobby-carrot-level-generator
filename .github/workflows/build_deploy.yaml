name: "Build and publish image"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Download dependencies
      run: |
        tools/fetch_assets.sh
        wget -O docker/sdl-release-2.32.10.zip https://github.com/libsdl-org/SDL/archive/release-2.32.10.zip

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: antoxabarin/bobby:latest

    - name: Extract artifacts from image
      run: |
        set -euo pipefail
        mkdir -p ./pages
        container_id=$(docker create antoxabarin/bobby:latest)
        docker cp "${container_id}:/usr/share/nginx/html/." ./pages/
        docker rm "${container_id}"
        
        ls -la ./pages
        test -f ./pages/index.html
        test -f ./pages/index.js
        test -f ./pages/index.wasm
        test -f ./pages/index.data

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5