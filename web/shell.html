<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Bobby Carrot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥕</text></svg>">
  <style>
    :root { --bg: #11150f; --panel: #1b2117; --ink: #d8e3c8; --dim: #6f7d63; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      overscroll-behavior: none; touch-action: none;
    }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
    #stage { position: relative; display: flex; align-items: center; justify-content: center; }
    canvas {
      display: block; background: #000;
      image-rendering: pixelated; image-rendering: crisp-edges;
      max-width: min(92vw, 70vh); max-height: 70vh; width: auto; height: auto;
      border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
      outline: none;
    }
    #loader {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: var(--panel); border-radius: 6px; text-align: center; padding: 20px;
    }
    #loader.hidden { display: none; }
    #bar { width: 180px; height: 6px; background: #2b3425; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    #bar > i { display: block; height: 100%; width: 0%; background: #c7792f; transition: width .2s; }
    footer { color: var(--dim); text-align: center; max-width: 560px;
      display: flex; flex-direction: column; align-items: center; gap: 8px; }
    kbd, .key { background: #263020; border: 1px solid #36422c; border-bottom-width: 2px;
      border-radius: 4px; padding: 0 5px; color: var(--ink); }
    /* Key labels that also work as buttons: clicking one presses that key. */
    .key { font: inherit; line-height: inherit; margin: 0; cursor: pointer; }
    .key:hover { background: #33402a; border-color: #c7792f; }
    .key:active { transform: translateY(1px); border-bottom-width: 1px; }
    @media (max-width: 640px) { footer .desktop-only { display: none; } }
    @media (min-width: 641px) { footer .mobile-only { display: none; } }
    /* Key hints under the game, one group per row. A key and its label wrap
       to the next line together. */
    footer .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 18px; }
    footer .row > span { white-space: nowrap; }

    /* Start page: covers the canvas while the game is on its title screen. */
    #menu {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 20px;
      background: var(--panel); border-radius: 6px; text-align: center;
    }
    #menu h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: .04em; }
    #menu h1 span { display: block; font-size: 40px; line-height: 1.2; }
    .btn {
      font: inherit; color: var(--ink); background: #263020; cursor: pointer;
      border: 1px solid #36422c; border-bottom-width: 3px; border-radius: 6px;
      padding: 8px 18px; min-width: 200px;
    }
    .btn:hover, .btn:focus-visible, .btn.selected { background: #33402a; border-color: #c7792f; outline: none; }
    #menu .btn:not(.selected) { background: #263020; border-color: #36422c; }
    .btn:active { transform: translateY(1px); border-bottom-width: 2px; }
    .hidden { display: none !important; }

    /* Asked before every level made with G or "Generate level": a random
       seed or a given one. Covers the canvas like the start page. */
    #seed-dialog {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; padding: 20px;
      background: rgba(27, 33, 23, .96); border-radius: 6px; text-align: center;
    }
    #seed-dialog h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: .04em; }
    #seed-dialog .note { color: var(--dim); }
    #seed-choice, #seed-form { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #seed-input {
      font: inherit; color: var(--ink); background: var(--bg); text-align: center;
      border: 1px solid #36422c; border-radius: 6px; padding: 8px 12px; width: 200px;
    }
    #seed-input:focus { border-color: #c7792f; outline: none; }
    #seed-error { color: #e0866b; min-height: 1.5em; }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="menu" class="hidden">
    <h1><span>🥕</span>Bobby Carrot</h1>
    <button class="btn" id="btn-generate" type="button">Generate level</button>
    <button class="btn" id="btn-select" type="button">Select level</button>
  </div>
  <div id="seed-dialog" class="hidden" role="dialog" aria-labelledby="seed-title">
    <h2 id="seed-title">New level</h2>
    <div class="note" id="seed-size"></div>
    <div id="seed-choice">
      <button class="btn" id="btn-seed-random" type="button">Random seed</button>
      <button class="btn" id="btn-seed-fixed" type="button">Enter seed</button>
    </div>
    <form id="seed-form" class="hidden" autocomplete="off" novalidate>
      <input id="seed-input" type="text" inputmode="numeric" pattern="[0-9]*"
             placeholder="seed" aria-label="seed" spellcheck="false">
      <div id="seed-error"></div>
      <button class="btn" type="submit">Generate</button>
      <button class="btn" id="btn-seed-back" type="button">Back</button>
    </form>
    <div class="note desktop-only"><kbd>Esc</kbd> cancel</div>
  </div>
  <div id="loader">
    <div>
      <div id="status">loading…</div>
      <div id="bar"><i></i></div>
    </div>
  </div>
</div>

<footer id="menu-footer" class="hidden">
  <span class="desktop-only">
    <button class="key" type="button" tabindex="-1" data-menu="up">↑</button><button class="key" type="button" tabindex="-1" data-menu="down">↓</button> choose ·
    <button class="key" type="button" tabindex="-1" data-menu="enter">Enter</button> confirm
  </span>
</footer>

<footer id="game-footer" class="hidden">
  <!-- data-key is the SDL keycode the label stands for: the letter's code,
       13 = Enter, 27 = Esc, 1073741903..1073741906 = Right, Left, Down, Up.
       data-show lists the screens an item is shown on: play (built-in level),
       gen (generated level), select (level select), end (ending). -->
  <div class="row">
    <span data-show="play gen"><button class="key" type="button" tabindex="-1" data-key="104">H</button> show hint</span>
    <span data-show="play gen"><button class="key" type="button" tabindex="-1" data-key="114">R</button> restart</span>
    <span data-show="play gen"><button class="key" type="button" tabindex="-1" data-key="103">G</button> generate level</span>
    <span data-show="gen select"><button class="key" type="button" tabindex="-1" data-key="98">B</button> map size</span>
    <span data-show="select"><button class="key" type="button" tabindex="-1" data-key="1073741906">↑</button><button class="key" type="button" tabindex="-1" data-key="1073741905">↓</button><button class="key" type="button" tabindex="-1" data-key="1073741904">←</button><button class="key" type="button" tabindex="-1" data-key="1073741903">→</button> choose</span>
    <span data-show="select"><button class="key" type="button" tabindex="-1" data-key="13">Enter</button> play</span>
    <span data-show="end"><button class="key" type="button" tabindex="-1" data-key="13">Enter</button> continue</span>
    <span data-show="play select"><button class="key" type="button" tabindex="-1" data-key="116">T</button> carrot/egg mode</span>
    <span data-show="gen"><button class="key" type="button" tabindex="-1" data-key="101">E</button> copy link to level</span>
  </div>
  <div class="row">
    <span data-show="play gen"><button class="key" type="button" tabindex="-1" data-key="1073741906">↑</button><button class="key" type="button" tabindex="-1" data-key="1073741905">↓</button><button class="key" type="button" tabindex="-1" data-key="1073741904">←</button><button class="key" type="button" tabindex="-1" data-key="1073741903">→</button> move</span>
    <span data-show="play gen"><button class="key" type="button" tabindex="-1" data-key="27">Esc</button> level list</span>
    <span data-show="select"><button class="key" type="button" tabindex="-1" data-key="103">G</button> generate level</span>
    <span data-show="play gen select end"><button class="key" type="button" tabindex="-1" data-key="113">Q</button> main menu</span>
  </div>
  <div class="row">
    <span data-show="play gen select end"><button class="key" type="button" tabindex="-1" data-key="102">F</button> view</span>
    <span data-show="play gen select end"><button class="key" type="button" tabindex="-1" data-key="109">M</button> mute</span>
  </div>
  <span class="mobile-only">swipe to move, tap the arrows, tap to confirm</span>
</footer>

<script>
  const canvas = document.getElementById('canvas');
  const loader = document.getElementById('loader');
  const statusEl = document.getElementById('status');
  const barFill = document.querySelector('#bar > i');
  const menu = document.getElementById('menu');
  const gameFooter = document.getElementById('game-footer');
  const menuFooter = document.getElementById('menu-footer');
  const menuButtons = [document.getElementById('btn-generate'),
    document.getElementById('btn-select')];
  let menuIndex = 0;

  // One highlighted button at a time, whether picked by keys or the mouse.
  function selectMenu(i) {
    menuIndex = (i + menuButtons.length) % menuButtons.length;
    menuButtons.forEach((b, k) => b.classList.toggle('selected', k === menuIndex));
    menuButtons[menuIndex].focus();
  }
  menuButtons.forEach((b, k) => {
    b.addEventListener('mouseenter', () => selectMenu(k));
    b.addEventListener('focus', () => { if (k !== menuIndex) selectMenu(k); });
  });

  // Screen numbers match App::Screen in src/platform/app.hpp.
  const SCREEN_TITLE = 0;
  const SCREEN_SELECT = 1;
  const SCREEN_END = 4;

  // Only the key hints that work on the current screen are shown.
  function showHintsFor(screen) {
    document.querySelectorAll('#game-footer [data-show]').forEach((item) => {
      item.classList.toggle('hidden', !item.dataset.show.split(' ').includes(screen));
    });
  }

  // While the start page is up, keys drive its buttons and do not reach the
  // game: Up/Down choose, Enter or Space confirm. G still generates a level
  // from anywhere. Registered before SDL adds its own listeners, so it runs
  // first.
  window.addEventListener('keydown', (e) => {
    if (seedDialogOpen()) return;  // the seed dialog takes its own keys
    if (menu.classList.contains('hidden') || e.key === 'g' || e.key === 'G') return;
    e.stopImmediatePropagation();
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      selectMenu(menuIndex + (e.key === 'ArrowUp' ? -1 : 1));
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!e.repeat) menuButtons[menuIndex].click();
    }
  }, true);

  // The game switches screen on its next frame and then calls
  // onScreenChange, which moves the focus where it belongs.
  function callGame(name) {
    const fn = Module['_' + name];
    if (fn) fn();
  }
  // Through the G key, so the game asks for the seed with the map size.
  document.getElementById('btn-generate').addEventListener('click', () => {
    if (Module._bc_press_key) Module._bc_press_key(103);
  });
  document.getElementById('btn-select').addEventListener('click', () => callGame('bc_select_level'));

  // Clickable key labels. Pressing the mouse on them must not take the focus,
  // or Space in the game would click the label again.
  document.querySelectorAll('.key').forEach((k) => {
    k.addEventListener('mousedown', (e) => e.preventDefault());
  });
  document.querySelectorAll('.key[data-key]').forEach((k) => {
    k.addEventListener('click', () => {
      if (Module._bc_press_key) Module._bc_press_key(Number(k.dataset.key));
    });
  });
  document.querySelectorAll('.key[data-menu]').forEach((k) => {
    k.addEventListener('click', () => {
      const action = k.dataset.menu;
      if (action === 'enter') menuButtons[menuIndex].click();
      else selectMenu(menuIndex + (action === 'up' ? -1 : 1));
    });
  });

  // --- seed dialog ---------------------------------------------------------
  // Opened by the game (App::askToGenerate) through Module.askSeed(size).
  // "Random seed" generates at once; "Enter seed" shows a field for one.
  const MAX_SEED = 4294967295;  // seeds are 32-bit, 0 means random
  const seedDialog = document.getElementById('seed-dialog');
  const seedChoice = document.getElementById('seed-choice');
  const seedForm = document.getElementById('seed-form');
  const seedInput = document.getElementById('seed-input');
  const seedError = document.getElementById('seed-error');
  const seedButtons = [document.getElementById('btn-seed-random'),
    document.getElementById('btn-seed-fixed')];

  function seedDialogOpen() { return !seedDialog.classList.contains('hidden'); }

  function showSeedChoice() {
    seedForm.classList.add('hidden');
    seedChoice.classList.remove('hidden');
    seedButtons[0].focus();
  }

  function openSeedDialog(size) {
    document.getElementById('seed-size').textContent = 'map ' + size + ' \u00d7 ' + size;
    seedInput.value = '';
    seedError.textContent = '';
    seedDialog.classList.remove('hidden');
    showSeedChoice();
  }

  function closeSeedDialog() {
    seedDialog.classList.add('hidden');
    if (!menu.classList.contains('hidden')) selectMenu(menuIndex);
    else canvas.focus();
  }

  function generateWithSeed(seed) {
    closeSeedDialog();
    // >>> 0 keeps seeds above 2^31 whole on their way to the unsigned int
    if (Module._bc_generate_level) Module._bc_generate_level(seed >>> 0);
  }

  seedButtons[0].addEventListener('click', () => generateWithSeed(0));
  seedButtons[1].addEventListener('click', () => {
    seedChoice.classList.add('hidden');
    seedForm.classList.remove('hidden');
    seedError.textContent = '';
    seedInput.focus();
    seedInput.select();
  });
  document.getElementById('btn-seed-back').addEventListener('click', showSeedChoice);
  seedInput.addEventListener('input', () => { seedError.textContent = ''; });
  seedForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = seedInput.value.trim();
    const seed = /^[0-9]{1,10}$/.test(text) ? Number(text) : NaN;
    if (!(seed >= 1 && seed <= MAX_SEED)) {
      seedError.textContent = 'a whole number from 1 to ' + MAX_SEED;
      seedInput.focus();
      return;
    }
    generateWithSeed(seed);
  });

  // Keys pressed in the dialog stay in it: SDL listens on the window, and
  // would otherwise move Bobby or restart the level while a seed is typed.
  // Key-ups still go through, so SDL never thinks a key is held down.
  ['keydown', 'keypress'].forEach((type) => {
    seedDialog.addEventListener(type, (e) => {
      e.stopPropagation();
      if (type !== 'keydown') return;
      if (e.key === 'Escape') {
        e.preventDefault();
        if (seedForm.classList.contains('hidden')) closeSeedDialog();
        else showSeedChoice();
      } else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') &&
                 !seedChoice.classList.contains('hidden')) {
        e.preventDefault();
        const i = seedButtons.indexOf(document.activeElement);
        seedButtons[(i + 1) % seedButtons.length].focus();
      }
    });
  });
  seedButtons.forEach((b) => b.addEventListener('mouseenter', () => b.focus()));

  // Arrow keys and space scroll the page by default, which fights the game.
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, { passive: false });

  var Module = {
    canvas: canvas,
    preRun: [() => {
      try {
        // A shared generated level: ?seed=<seed>&size=<side>, read by main().
        const params = new URLSearchParams(window.location.search);
        const seed = params.get('seed');
        if (seed) {
          Module.__seed = seed;
          const size = params.get('size');
          if (size) Module.__size = size;
          console.log('[bobby] start with seed ' + seed + ', size ' + (size || 16));
        }
      } catch (e) {
        console.warn('[bobby] failed to parse URL:', e);
      }
    }],

    postRun: [() => { loader.classList.add('hidden'); canvas.focus(); }],
    // Called by App::reportScreen() whenever the game changes screen, or a
    // generated level replaces a built-in one or the other way round.
    onScreenChange: (screen, generated) => {
      const onTitle = screen === SCREEN_TITLE;
      showHintsFor(screen === SCREEN_SELECT ? 'select'
                   : screen === SCREEN_END ? 'end'
                   : generated ? 'gen' : 'play');
      menu.classList.toggle('hidden', !onTitle);
      gameFooter.classList.toggle('hidden', onTitle);
      menuFooter.classList.toggle('hidden', !onTitle);
      // Off the menu, keep the focus off the buttons, so Space or Enter in the
      // game does not press "Main menu" again.
      if (onTitle) selectMenu(menuIndex);
      else canvas.focus();
    },
    askSeed: openSeedDialog,
    print: (...a) => console.log(...a),
    printErr: (...a) => console.warn(...a),
    setStatus: (text) => {
      if (!text) { barFill.style.width = '100%'; return; }
      statusEl.textContent = text;
      const m = /([\d.]+)\s*\/\s*([\d.]+)/.exec(text);
      if (m) barFill.style.width = (100 * parseFloat(m[1]) / parseFloat(m[2])) + '%';
    },
  };
  Module.setStatus('loading…');
</script>
{{{ SCRIPT }}}
</body>
</html>
