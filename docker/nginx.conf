server {
    # No IPv6 listener: a container started on a host with IPv6 disabled would
    # fail to bind and nginx would refuse to start. Published ports work over
    # IPv4 regardless.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A wasm module must arrive as application/wasm or the browser refuses to
    # stream-compile it. Older nginx builds do not have it in mime.types, so it
    # is forced here: an empty types block plus default_type always wins, and
    # does not clash with a definition that is already there.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The preloaded asset package: opaque bytes, same caching story.
    location ~ \.data$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and the glue code change on every rebuild, so they must not be
    # cached, otherwise a rebuilt image serves a stale loader against a fresh
    # wasm module.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /index.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    # text/html is always compressed and must not be repeated here, or nginx
    # warns about a duplicate MIME type on every start.
    gzip_types application/javascript application/wasm text/css application/octet-stream;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
