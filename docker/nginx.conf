server {
    # Avoid bind failures on hosts with IPv6 disabled.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Force the MIME type required for streaming WebAssembly compilation.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.data$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate loaders so a rebuild does not mix stale glue with new WebAssembly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /index.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    # nginx already includes text/html in gzip_types.
    gzip_types application/javascript application/wasm text/css application/octet-stream;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
